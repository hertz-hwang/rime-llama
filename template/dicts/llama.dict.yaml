---
name: llama
version: "beta"
sort: by_weight
use_preset_vocabulary: false
columns:
  - text
  - code
  - weight
  - stem
encoder:
  exclude_patterns:
    - '^[a-z]$'  # 一简不参与造词
    - '[^a-z]'
    - '^bg(zs|zx|ys|yx|jc|hx|sx)$'  # 表格
    - '^sz[lyeswlqbj]'  # 数字
  rules:
    - length_equal: 2
      formula: "AaAbBaBb"
    - length_equal: 3
      formula: "AaBaCaCb"
    - length_in_range: [4, 10]
      formula: "AaBaCaZa"
...

